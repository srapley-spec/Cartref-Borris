name: Probe ferry sources
# Manual only. Fetches each operator/aggregator page once from GitHub's runner and logs what is readable.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional whitespace-separated URLs (default list in tools/probe-sources.mjs)"
        required: false
      script:
        description: "Probe to run: probe-sources or probe-aferry"
        required: false
        default: probe-sources
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run probe
        env:
          PROBE: ${{ inputs.script }}
          PROBE_URLS: ${{ inputs.urls }}
          AFERRY_PAGE: ${{ inputs.urls }}
        run: |
          case "$PROBE" in
            probe-aferry) node tools/probe-aferry.mjs ;;
            ""|probe-sources) node tools/probe-sources.mjs ;;
            *) echo "unknown probe: $PROBE"; exit 1 ;;
          esac
