name: Fetch fares
# Once a day: read the six public AFerry route pages and Irish Ferries' two status pages; commit data/fares.json and
# data/ships.json if they changed.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fares
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-fares.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/fares.json data/ships.json)" ]; then echo "No change"; exit 0; fi  # also sees new, untracked files
          git config user.name "cartref-borris fares bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fares.json data/ships.json
          git commit -m "Update fares and ships ($(date -u +%F))" -m "Docs: none — scheduled data refresh."
          git push
