<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<title>Cartref Borris</title>
<style>
/* Signal tokens and geometry, from Cartref Commute src/signal.css (approved 2 Nov 2026). */
html {
  color-scheme: light;
  --paper:#f2f5f8; --card:#ffffff; --ink:#142436; --muted:#506174; --line:#d4dde7;
  --accent:#1453b6; --accent-ink:#ffffff; --signal-soft:#e8f0fd; --signal-inset:#edf2f7;
  --signal-control-line:#8191a5; --signal-shadow:0 2px 9px #10213606;
  --note:#746000; --note-bg:#fff7d2; --warn:#805000; --warn-bg:#fff1d9;
  }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) {
  color-scheme:dark;
  --paper:#090f16; --card:#121c28; --ink:#f0f5fc; --muted:#aabbd0; --line:#2c3b4e;
  --accent:#9bc3ff; --accent-ink:#0a1525; --signal-soft:#182d48; --signal-inset:#182433;
  --signal-control-line:#71869f; --signal-shadow:none; --note:#efdd88; --note-bg:#363219; --warn:#ffd08a; --warn-bg:#47331b;
} }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); }
.wrap { max-width:620px; margin:0 auto; display:grid; gap:8px; min-width:0; }
button { font:inherit; min-width:44px; min-height:44px; touch-action:manipulation; cursor:pointer; }
:is(button,input,summary,a):focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.toolbar { display:flex; gap:6px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.seg { display:flex; padding:2px; border-radius:10px; background:var(--signal-inset); flex-wrap:wrap; max-width:100%; }
.seg button { border:0; background:transparent; border-radius:8px; padding:8px 11px; font-size:14px; line-height:1.2; color:var(--muted); }
.seg button[aria-pressed="true"] { background:var(--card); color:var(--accent); box-shadow:0 1px 3px #0000000b; font-weight:600; }
.seg.full { width:100%; } .seg.full button { flex:1; min-width:0; padding-inline:6px; }
.icons { display:flex; gap:2px; } .iconbtn { border:0; background:transparent; color:var(--accent); border-radius:8px; font-size:22px; padding:6px; }
#ctx > summary { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:6px; color:var(--muted); font-size:13px; font-weight:600; list-style:none; cursor:pointer; }
#ctx > summary::-webkit-details-marker { display:none; } #ctx > summary::after { content:'⌄'; color:var(--accent); font-size:16px; }
#ctx[open] { padding:0 10px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
#ctx[open] > summary::after { content:'⌃'; }
.f { display:grid; gap:4px; font-size:13px; color:var(--muted); font-weight:600; min-width:0; }
.f input { min-height:44px; font:inherit; font-size:16px; padding:6px 8px; border:1px solid var(--signal-control-line); border-radius:8px; background:var(--card); color:var(--ink); width:100%; min-width:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ctlrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
.stepper { display:flex; align-items:center; gap:4px; } .stepper b { min-width:1.5em; text-align:center; font-size:16px; }
.ghost { border:1px solid var(--signal-control-line); background:var(--card); color:var(--accent); border-radius:9px; padding:8px 11px; font-size:14px; }
.ghost[aria-pressed="true"] { background:var(--signal-soft); border-color:var(--accent); font-weight:650; }
.primary { display:inline-flex; align-items:center; justify-content:center; min-height:44px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:9px; padding:8px 14px; font-size:14px; font-weight:700; text-decoration:none; }
#banner .stale { color:var(--warn); font-weight:700; }
#sources { display:grid; gap:8px; font-size:14px; } #sources h3 { margin:0; font-size:16px; color:var(--muted); }
.src-row { display:grid; gap:2px; padding:8px 10px; border-radius:10px; background:var(--card); border:1px solid var(--line); }
.src-row small { color:var(--muted); font-size:12px; } .src-row.stale { border-color:var(--warn); } .src-row.stale span { color:var(--warn); font-weight:650; }
#banner:not(:empty), .banner-inline { background:var(--note-bg); color:var(--note); padding:8px 10px; border-radius:10px; font-size:13px; }
#status:not(:empty) { font-size:13px; color:var(--muted); }
#hero, #list > .opt, #roundTrip:not(:empty) { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:var(--signal-shadow); }
#hero { display:grid; gap:10px; }
.hero-cap { font-size:14px; color:var(--muted); font-weight:600; }
.opt { display:grid; gap:8px; min-width:0; }
.optrow { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:end; gap:0 8px; }
.optrow > div { display:grid; min-width:0; } .optrow > div:last-child { text-align:right; justify-items:end; }
.optrow small, .leg-cols small { font-size:12px; font-weight:600; color:var(--muted); line-height:1.4; }
.optbig { font-size:36px; font-weight:750; letter-spacing:-.035em; line-height:1.1; font-variant-numeric:tabular-nums; }
.optbig.arrive { font-size:32px; }
.optarrow { font-size:20px; color:var(--muted); padding-bottom:5px; }
.nd { font-size:12px; color:var(--muted); font-weight:600; }
.journey-facts { display:grid; justify-items:center; gap:2px; font-size:13px; color:var(--muted); }
.journey-total-time { padding:2px 10px; border-radius:999px; background:var(--signal-inset); color:var(--ink); font-weight:650; font-size:15px; }
.journey-countdown { color:var(--muted); font-size:15px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:13px; font-weight:650; padding:3px 8px; border-radius:7px; border:1px solid var(--line); color:var(--ink); }
.tag.best { background:var(--signal-soft); border-color:transparent; color:var(--accent); }
.next-svc { font-size:16px; }
.leg-panel { background:var(--signal-inset); border-left:4px solid var(--accent); border-radius:10px; padding:10px 12px; display:grid; gap:6px; }
.leg-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:14px; font-weight:650; color:var(--muted); }
.leg-cols { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.leg-cols > div { display:grid; align-content:start; min-width:0; } .leg-cols > div:nth-child(2) { text-align:center; } .leg-cols > div:nth-child(3) { text-align:right; }
.legbig { font-size:30px; font-weight:750; letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums; }
.legbig.muted { font-size:16px; font-weight:600; color:var(--muted); padding-top:8px; }
.leg-meta { font-size:14px; color:var(--muted); } .leg-meta b { color:var(--ink); }
.unverified { color:var(--note); background:var(--note-bg); padding:0 5px; border-radius:4px; font-size:12px; font-weight:600; }
.op { display:inline-flex; align-items:center; padding:3px 6px; border-radius:7px; background:#fff; box-shadow:0 0 0 1px var(--line); }
.op img { display:block; height:28px; width:auto; } .op-text { color:#142436; font-size:13px; font-weight:700; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.drive-leg { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:14px; }
.drive-leg .dl { font-weight:600; } .roads { display:inline-flex; flex-wrap:wrap; gap:4px; } .roads-src { color:var(--muted); font-size:12px; }
/* Road signs (identity, not status): UK/IE motorway blue/white; UK primary A green/yellow; IE national N green/white-yellow; IE regional R white. */
.road { display:inline-block; min-width:2.6em; text-align:center; padding:1px 6px; border-radius:4px; font-size:13px; font-weight:800; line-height:1.35; letter-spacing:.01em; border:1.5px solid #fff; box-shadow:0 0 0 1px #0003; }
.road-m { background:#1d5eb4; color:#fff; } .road-a { background:#00703c; color:#ffd200; } .road-n { background:#00703c; color:#ffd200; }
.road-r { background:#fff; color:#111; border-color:#111; box-shadow:none; }
.ship { font-size:14px; color:var(--muted); } .ship b { color:var(--ink); }
.tag.sleep { background:var(--signal-soft); border-color:transparent; } .tag.night-drive { color:var(--note); background:var(--note-bg); border-color:transparent; }
.chip { font-size:13px; font-weight:600; padding:4px 8px; border-radius:7px; border:1px solid var(--line); background:var(--card); }
.fare { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:14px; }
.fare .price { font-size:20px; font-weight:750; } .fare .price.typical { font-weight:600; color:var(--muted); } .src { color:var(--muted); font-size:13px; }
.fare input { width:84px; min-height:36px; font:inherit; font-size:16px; padding:4px 6px; border:1px solid var(--signal-control-line); border-radius:7px; background:var(--card); color:var(--ink); }
.actions { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.steps { flex:1; min-width:0; } .steps > summary { min-height:44px; display:flex; align-items:center; gap:6px; color:var(--accent); font-weight:650; font-size:16px; cursor:pointer; list-style:none; }
.steps > summary::-webkit-details-marker { display:none; } .steps > summary::before { content:'›'; font-size:22px; transition:transform .15s; } .steps[open] > summary::before { transform:rotate(90deg); }
.steps ol { list-style:none; padding:0; margin:4px 0 0; display:grid; gap:6px; font-size:14px; }
.steps li { display:grid; grid-template-columns:3.2em 1fr; gap:8px; } .st { font-weight:700; font-variant-numeric:tabular-nums; }
.flags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .flags span { font-size:12px; color:var(--note); background:var(--note-bg); padding:1px 6px; border-radius:4px; }
.next-best { border-top:1px solid var(--line); padding-top:12px; } .next-best h3, #roundTrip h3 { margin:0 0 8px; font-size:16px; color:var(--muted); }
h2 { font-size:16px; margin:12px 0 0; color:var(--muted); }
#list { display:grid; gap:8px; }
.compact { gap:6px; } .compact :is(.next-svc,.chips,.journey-countdown,.leg-head > span:not(.op)) { display:none; } .compact .leg-panel { padding:8px 10px; }
.compact .optbig { font-size:28px; } .compact .optbig.arrive { font-size:28px; } .compact .legbig { font-size:24px; } .compact .legbig.muted { font-size:14px; padding-top:6px; }
#roundTrip { display:grid; gap:6px; font-size:14px; } #roundTrip small { color:var(--muted); font-weight:650; }
.empty { color:var(--muted); margin:0; }
#settings { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:12px; }
#settings > summary { font-weight:650; min-height:44px; display:flex; align-items:center; cursor:pointer; }
.foot { font-size:12px; color:var(--muted); }
@media (max-width:360px) { .optbig { font-size:30px; } .optbig.arrive { font-size:28px; } .legbig { font-size:24px; } .seg button { padding-inline:7px; font-size:13px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="seg" id="dirSeg" role="group" aria-label="Direction"><button data-v="out">To Borris</button><button data-v="back">To Letchworth</button></div>
    <div class="icons"><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙︎</button><button class="iconbtn" id="refresh" aria-label="Refresh">↻</button></div>
  </div>
  <div class="seg full" id="questionSeg" role="group" aria-label="Question"><button data-v="now">Leave now</button><button data-v="arrive">Arrive by</button><button data-v="around">Leave around</button><button data-v="fastest">Fastest</button></div>
  <div class="grid2" id="timeRow" hidden><label class="f"><span id="timeLabel">Arrive by</span><input type="time" id="time"></label></div>
  <details id="ctx">
    <summary><span id="contextSummary"></span></summary>
    <div class="grid2">
      <label class="f">Leave home<input type="date" id="outDate"></label>
      <label class="f">Leave Borris<input type="date" id="backDate"></label>
    </div>
    <div class="ctlrow"><div class="seg" id="prefSeg" role="group" aria-label="Day or overnight"><button data-v="day">Day</button><button data-v="overnight">Overnight</button><button data-v="any">Either</button></div>
      <div class="seg" id="sortSeg" role="group" aria-label="Rank by"><button data-v="time">Fastest</button><button data-v="cost">Cheapest</button><button data-v="sleep">Best sleep</button></div></div>
    <div class="ctlrow"><span class="f" style="display:inline">Stops on the UK drive</span><div class="stepper"><button class="ghost" id="stopsDown" aria-label="Fewer stops">−</button><b id="stopsVal">1</b><button class="ghost" id="stopsUp" aria-label="More stops">+</button></div>
      <button class="ghost" id="fastFerry" aria-pressed="false">Fast ferry: off</button></div>
    <p class="foot" id="fastNote"></p>
  </details>
  <div id="banner"></div>
  <div id="status" role="status"></div>
  <section id="hero" aria-live="polite"></section>
  <h2 id="listTitle" hidden></h2>
  <section id="list"></section>
  <section id="roundTrip"></section>
  <section id="sources" aria-label="Data sources"></section>
  <p class="foot">Overnight = any part of the journey, door to door, between 00:00 and 05:00. Fares are singles for a car and 2 adults: enter the quote you see to rank by cost.</p>
  <details id="settings">
    <summary>Settings</summary>
    <div style="display:grid;gap:8px">
      <label class="f">Google Maps key (Routes API; stored only on this phone)<input type="password" id="key" autocomplete="off"></label>
      <div class="grid2">
        <label class="f">Minutes per stop<input type="number" id="stopMin" min="0" inputmode="numeric"></label>
        <label class="f">Extra margin before check-in (min)<input type="number" id="margin" min="0" inputmode="numeric"></label>
        <label class="f">Getting off the ferry (min)<input type="number" id="disembark" min="0" inputmode="numeric"></label>
      </div>
      <button class="primary" id="saveSettings" style="justify-self:start">Save</button>
    </div>
  </details>
</div>
<script type="module">
  import { start } from "./src/app.js";
  start().catch(e => { document.getElementById("status").textContent = "Couldn't load: " + e.message; });
</script>
</body>
</html>
